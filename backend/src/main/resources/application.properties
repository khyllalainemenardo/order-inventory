spring.application.name=shop-inventory

spring.datasource.url=${supabase.db.url}
spring.datasource.username=${supabase.db.user}
spring.datasource.password=${supabase.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false

inventory.low-stock-threshold=5
inventory.reorder-target=20

app.cors.allowed-origins=http://localhost:5173

server.port=8080

legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=23-6669-443
legacysupply.api-key=${LS_API_KEY:}
legacysupply.session-renew-after-seconds=150

supplier.send-pending-every-ms=30000
supplier.track-deliveries-every-ms=60000
