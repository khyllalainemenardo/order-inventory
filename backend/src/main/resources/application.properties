spring.application.name=shop-inventory

spring.datasource.url=${supabase.db.url}
spring.datasource.username=${supabase.db.user}
spring.datasource.password=${supabase.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false

inventory.low-stock-threshold=5
inventory.reorder-target=20

app.cors.allowed-origins=http://localhost:5173

server.port=8080

legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=23-6669-443
legacysupply.api-key=${LS_API_KEY:}
legacysupply.session-renew-after-seconds=150

supplier.send-pending-every-ms=10000
supplier.track-deliveries-every-ms=15000

spring.task.scheduling.pool.size=4

orders.backorder-max-wait-seconds=600
orders.backorder-review-every-ms=20000

tiangge.base-url=https://legacysupply.onrender.com/tiangge/v1
tiangge.poll-every-ms=3000
tiangge.heartbeat-every-seconds=30
