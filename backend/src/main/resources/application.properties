spring.application.name=shop-inventory

# --- Supabase (Postgres) -------------------------------------------------
# All three come from environment variables. Nothing secret lives in this file.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.config.import=optional:classpath:application-local.properties

# The schema is owned by db/schema.sql, not by Hibernate.
# 'validate' fails fast at startup if the tables do not match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Set to true while debugging to see the SQL the modules actually run.
spring.jpa.show-sql=false

# --- Inventory -----------------------------------------------------------
# A successful reservation that leaves stock below this raises a LowStock alert.
inventory.low-stock-threshold=5

# --- CORS ----------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

server.port=8080
